# Streamlit config for the Sovereign AI Workbench UI (Track B).
# Goal: the UI never contacts the internet and never loads a remote font, image or script.

[browser]
# No usage telemetry (otherwise the page fetches data.streamlit.io/metrics.json and posts events).
gatherUsageStats = false
# Setting the address the browser uses stops Streamlit from looking up this machine's
# external IP (checkip.amazonaws.com) when it prints URLs or checks a websocket origin.
serverAddress = "127.0.0.1"
serverPort = 8501

[server]
address = "127.0.0.1"
port = 8501
headless = true
# No "enter your email" prompt on first run (that email is posted to data.streamlit.io).
showEmailPrompt = false
# No live reload on save during the demo; files served only from the app, not a static folder.
runOnSave = false
enableStaticServing = false
maxUploadSize = 25            # same limit as WB_MAX_UPLOAD_MB

[client]
# No "Ask Google / Ask ChatGPT" links under errors.
showErrorLinks = false
# Hide the Deploy button and developer menu (they link to share.streamlit.io).
toolbarMode = "minimal"
# If anything slips past our own error handling, show a generic message, not a traceback.
showErrorDetails = "none"
showSidebarNavigation = false

[theme]
# "Blueprint" palette. The tokens live in ui/components/theme.py; these repeat the ones Streamlit's
# own widgets need (test_theme.py checks they match). Fonts are Windows system fonts with the
# bundled Streamlit fonts as fallback; no webfont URL anywhere.
base = "light"
primaryColor = "#1673E6"
backgroundColor = "#F4F8FC"
secondaryBackgroundColor = "#EAF1F8"
textColor = "#1B2A3A"
borderColor = "#DCE5EF"
linkColor = "#1467D0"
font = "Segoe UI, Source Sans, sans-serif"
headingFont = "Bahnschrift, Segoe UI, sans-serif"
codeFont = "Consolas, Source Code Pro, monospace"
baseFontSize = 15
baseRadius = "medium"
showSidebarBorder = true
redColor = "#C0283A"
greenColor = "#0E7A4E"
orangeColor = "#8A5A00"
yellowColor = "#8A5A00"
blueColor = "#1673E6"
# st.warning / st.error: amber only for warnings, red only for failures.
yellowBackgroundColor = "#FFF4DB"
yellowTextColor = "#8A5A00"
orangeBackgroundColor = "#FFF4DB"
orangeTextColor = "#8A5A00"
redBackgroundColor = "#FDECEE"
redTextColor = "#C0283A"
greenTextColor = "#0E7A4E"

[theme.sidebar]
backgroundColor = "#EAF1F8"
secondaryBackgroundColor = "#FFFFFF"
